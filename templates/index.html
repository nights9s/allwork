<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA Office AI</title>
<link rel="icon" href="/static/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --brand: #ED1B24; --brand-hover: #C8141C; --brand-soft: #FDECEC;
  --bg: #FFFFFF; --bg-side: #F7F7F8; --bg-soft: #F2F2F3; --bg-hover: #EAEAEC;
  --text: #1C1C1E; --text-2: #5F6066; --text-3: #8E8F96;
  --border: #E3E3E6; --ok: #1F9D55; --warn-bg: #FFF7E6; --warn: #A15C00;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand-soft: #3A1517;
    --bg: #18181A; --bg-side: #111113; --bg-soft: #232326; --bg-hover: #2C2C30;
    --text: #ECECEE; --text-2: #A8A9B0; --text-3: #75767D;
    --border: #2F2F33; --warn-bg: #33270F; --warn: #F0B45C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: "Sarabun", "Leelawadee UI", "Thonburi", sans-serif; font-size: 16px; color: var(--text); background: var(--bg); display: flex; overflow: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }
input, textarea { font: inherit; color: var(--text); }

/* ---------- Sidebar ---------- */
.side { width: 270px; flex-shrink: 0; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform .2s; }
.side-top { padding: 18px 16px 10px; }
.side-top img { height: 34px; display: block; margin: 0 0 4px 4px; }
.side-top .sub { font-size: 12.5px; color: var(--text-3); margin-left: 6px; letter-spacing: .3px; }
.new-chat { margin: 14px 0 0; width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-weight: 500; }
.new-chat:hover { background: var(--bg-hover); }
.side-scroll { flex: 1; overflow-y: auto; padding: 6px 10px 10px; }
.side h4 { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px; margin: 18px 8px 6px; }
.side-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 8px; text-align: left; font-size: 14.5px; text-decoration: none; color: var(--text); }
.side-item:hover { background: var(--bg-hover); }
.side-item .ic { width: 20px; text-align: center; }
.side-item .meta { margin-left: auto; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.side-item.doc { flex-direction: column; align-items: flex-start; gap: 0; }
.side-item.doc b { font-weight: 600; font-size: 13.5px; }
.side-item.doc span { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--bg-soft); color: var(--text-3); border: 1px solid var(--border); }
.empty-note { font-size: 13px; color: var(--text-3); padding: 4px 10px; }
.side-foot { padding: 12px 18px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--brand); }

/* ---------- Main ---------- */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { display: none; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.topbar img { height: 24px; }
.icon-btn { border: 0; background: none; padding: 6px; border-radius: 8px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--bg-hover); }
.chat { flex: 1; overflow-y: auto; }
.thread { max-width: 780px; margin: 0 auto; padding: 28px 20px 12px; }

.welcome { text-align: center; padding: 9vh 0 20px; }
.welcome img { width: 64px; height: 64px; }
.welcome h1 { font-size: 28px; font-weight: 600; margin: 18px 0 6px; }
.welcome p { color: var(--text-2); margin: 0 0 30px; }
.suggest { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: left; }
.suggest button { text-align: left; border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; transition: border-color .15s, background .15s; }
.suggest button:hover { border-color: var(--brand); background: var(--brand-soft); }
.suggest .ic { font-size: 20px; line-height: 1.3; }
.suggest b { display: block; font-weight: 600; font-size: 15px; }
.suggest span { font-size: 13.5px; color: var(--text-2); }

.msg { display: flex; gap: 14px; margin: 0 0 26px; line-height: 1.7; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--bg-soft); padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 80%; white-space: pre-wrap; word-wrap: break-word; }
.avatar { width: 30px; height: 30px; flex-shrink: 0; margin-top: 2px; }
.msg.ai .body { flex: 1; min-width: 0; word-wrap: break-word; }
.body p { margin: 0 0 10px; } .body p:last-child { margin-bottom: 0; }
.body ul, .body ol { margin: 4px 0 10px; padding-left: 22px; }
.body code { background: var(--bg-soft); padding: 1px 6px; border-radius: 5px; font-size: 14px; }
.body h3 { font-size: 17px; margin: 14px 0 6px; }
.status { color: var(--text-3); font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.typing span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); margin-right: 3px; animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.err { color: var(--brand); }

/* ---------- Form card ---------- */
.card { border: 1px solid var(--border); border-radius: 14px; background: var(--bg); box-shadow: var(--shadow); margin-top: 14px; overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--bg-side); font-weight: 600; }
.card-head .tag { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-3); }
.card-body { padding: 16px 18px; }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.warnbox ul { margin: 4px 0 0; padding-left: 20px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }
.field label .req { color: var(--brand); }
.in { width: 100%; min-width: 0; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); outline: none; transition: border-color .15s, box-shadow .15s; }
.in:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.in.missing { border-color: var(--brand); background: var(--brand-soft); }
.in.r { text-align: right; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.items { width: 100%; border-collapse: collapse; margin: 4px 0 6px; }
.items th { font-size: 12.5px; font-weight: 500; color: var(--text-2); text-align: left; padding: 0 4px 4px; }
.items td { padding: 3px 4px; vertical-align: middle; }
.items .amt { text-align: right; font-size: 14.5px; white-space: nowrap; color: var(--text-2); }
.del { border: 0; background: none; color: var(--text-3); padding: 4px 6px; border-radius: 6px; font-size: 18px; line-height: 1; }
.del:hover { color: var(--brand); background: var(--brand-soft); }
.add { border: 1px dashed var(--border); background: none; border-radius: 8px; padding: 6px 12px; font-size: 14px; color: var(--text-2); margin-bottom: 14px; }
.add:hover { border-color: var(--brand); color: var(--brand); }
.sum { margin-left: auto; width: 280px; font-size: 14.5px; }
.sum div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--text-2); }
.sum .total { color: var(--text); font-weight: 700; font-size: 16px; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; }
.card-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
.btn { border: 1px solid var(--border); background: var(--bg); border-radius: 9px; padding: 8px 18px; font-weight: 500; text-decoration: none; color: var(--text); display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-hover); }
.btn:disabled { opacity: .55; cursor: default; }

.doc-card { display: flex; align-items: center; gap: 16px; padding: 16px 18px; }
.doc-icon { width: 46px; height: 54px; border-radius: 6px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.doc-info { flex: 1; min-width: 0; }
.doc-info b { font-size: 16px; }
.doc-info div { font-size: 14px; color: var(--text-2); }
.doc-info .money { color: var(--text); font-weight: 600; font-size: 15px; }
.doc-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Composer ---------- */
.composer-wrap { padding: 8px 20px 18px; }
.composer { max-width: 780px; margin: 0 auto; border: 1px solid var(--border); border-radius: 18px; background: var(--bg); box-shadow: var(--shadow); display: flex; align-items: flex-end; padding: 8px 8px 8px 18px; transition: border-color .15s; }
.composer:focus-within { border-color: var(--text-3); }
.composer textarea { flex: 1; border: 0; outline: none; resize: none; background: none; max-height: 200px; padding: 7px 0; line-height: 1.55; }
.send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; display: grid; place-items: center; flex-shrink: 0; transition: background .15s, opacity .15s; }
.send:hover { background: var(--brand-hover); }
.send:disabled { opacity: .35; cursor: default; }
.hint { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--text-3); }

.scrim { display: none; }
@media (max-width: 820px) {
  .side { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); }
  .side.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  .topbar { display: flex; }
  .thread { padding: 18px 16px 8px; }
  .composer-wrap { padding: 6px 12px 12px; }
  .suggest { grid-template-columns: 1fr; }
  .row2 { grid-template-columns: 1fr; }
  .sum { width: 100%; }
  .welcome { padding-top: 5vh; }
  /* รายการสินค้าบนมือถือ: ชื่อสินค้าเต็มบรรทัด แล้ว จำนวน | หน่วย | ราคา | ลบ อยู่บรรทัดล่าง */
  .items, .items tbody { display: block; }
  .items tr:first-child { display: none; }
  .items tr { display: grid; grid-template-columns: 1fr 1fr 1.4fr 30px; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .items td { padding: 0; }
  .items td:first-child { grid-column: 1 / -1; }
  .items td.amt { grid-column: 1 / -1; grid-row: 3; text-align: right; }
  .items td:last-child { grid-column: 4; grid-row: 2; }
  .msg { gap: 10px; }
  .msg.ai .avatar { width: 26px; height: 26px; }
  .card-body, .card-foot { padding-left: 14px; padding-right: 14px; }
  .doc-card { flex-wrap: wrap; }
  .doc-actions { width: 100%; justify-content: flex-end; }
}
</style>
</head>
<body>

<aside class="side" id="side">
  <div class="side-top">
    <img src="/static/logo.png" alt="DNA">
    <div class="sub">Office AI</div>
    <button class="new-chat" id="newChat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      แชทใหม่
    </button>
  </div>
  <div class="side-scroll">
    <h4>งานเอกสาร</h4>
    <div id="taskList"></div>
    <h4>เอกสารล่าสุด</h4>
    <div id="docList"><div class="empty-note">ยังไม่มีเอกสาร</div></div>
  </div>
  <div class="side-foot"><span class="dot" id="dot"></span><span id="statusText">กำลังเชื่อมต่อ...</span></div>
</aside>
<div class="scrim" id="scrim"></div>

<main class="main">
  <div class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="เมนู">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <img src="/static/logo.png" alt="DNA">
  </div>
  <div class="chat" id="chat"><div class="thread" id="thread"></div></div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="พิมพ์คำถามหรือสั่งงาน เช่น ออกใบเสนอราคา..."></textarea>
      <button class="send" id="send" aria-label="ส่ง" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="hint">Enter เพื่อส่ง · Shift+Enter ขึ้นบรรทัดใหม่ · AI อาจผิดพลาดได้ ตรวจเอกสารก่อนส่งลูกค้าทุกครั้ง</div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const thread = $("#thread"), chatEl = $("#chat"), input = $("#input"), sendBtn = $("#send");
let history = [], busy = false, tasks = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n || 0).toLocaleString("th-TH", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const scrollDown = () => chatEl.scrollTop = chatEl.scrollHeight;

// Markdown อย่างง่ายสำหรับคำตอบของ AI
function md(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of src.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); }
    else if (!line.trim()) { close(); }
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join("");
}

// ---------- Welcome ----------
function showWelcome() {
  const ready = tasks.filter(t => t.ready);
  const cards = [
    ...ready.map(t => ({ic: t.icon, title: t.name, text: t.example})),
    {ic: "✉️", title: "ร่างอีเมล", text: "ช่วยร่างอีเมลติดตามการชำระเงินถึงลูกค้าแบบสุภาพ"},
    {ic: "📝", title: "สรุปข้อความ", text: "ช่วยสรุปประเด็นสำคัญจากข้อความนี้ให้หน่อย"},
    {ic: "💡", title: "ถามได้ทุกเรื่อง", text: "ระบบนี้ช่วยงานอะไรได้บ้าง"},
  ].slice(0, 4);
  thread.innerHTML = `<div class="welcome">
      <img src="/static/mark.png" alt="">
      <h1>สวัสดีครับ มีอะไรให้ช่วยวันนี้?</h1>
      <p>พิมพ์คำถามหรือสั่งงานเอกสารได้เลย ถ้าข้อมูลไม่ครบ ระบบจะขึ้นฟอร์มให้กรอกเพิ่ม</p>
      <div class="suggest">${cards.map(c => `<button data-text="${esc(c.text)}"><span class="ic">${c.ic}</span><span><b>${esc(c.title)}</b><span>${esc(c.text)}</span></span></button>`).join("")}</div>
    </div>`;
  thread.querySelectorAll(".suggest button").forEach(b => b.onclick = () => { input.value = b.dataset.text; autoGrow(); input.focus(); sendBtn.disabled = false; });
}

// ---------- Messages ----------
function addUser(text) {
  thread.querySelector(".welcome")?.remove();
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  thread.appendChild(el); scrollDown();
}
function addAI() {
  const el = document.createElement("div");
  el.className = "msg ai";
  el.innerHTML = `<img class="avatar" src="/static/mark.png" alt=""><div class="body"><div class="status typing"><span></span><span></span><span></span></div></div>`;
  thread.appendChild(el); scrollDown();
  return el.querySelector(".body");
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = ""; autoGrow();
  addUser(text);
  history.push({role: "user", content: text});
  const body = addAI();
  let reply = "", textEl = null;
  const ensureText = () => { if (!textEl) { body.innerHTML = ""; textEl = document.createElement("div"); body.appendChild(textEl); } return textEl; };

  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({messages: history})});
    if (!r.ok) throw new Error(`server ตอบกลับ ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "status") body.innerHTML = `<div class="status"><span class="typing"><span></span><span></span><span></span></span>${esc(ev.text)}</div>`;
        else if (ev.type === "token") { reply += ev.text; ensureText().innerHTML = md(reply); }
        else if (ev.type === "form") { ensureText(); renderQuotationForm(body, ev); }
        else if (ev.type === "error") { ensureText().innerHTML += `<p class="err">${esc(ev.text)}</p>`; }
        scrollDown();
      }
    }
    if (!textEl) body.innerHTML = "";
  } catch (e) {
    ensureText().innerHTML = `<p class="err">เชื่อมต่อ server ไม่ได้: ${esc(e.message)}</p>`;
  }
  if (reply) history.push({role: "assistant", content: reply});
  busy = false; sendBtn.disabled = !input.value.trim();
  input.focus();
}

// ---------- Quotation form ----------
function renderQuotationForm(container, ev, docNo = null) {
  const d = ev.data || {};
  const state = {
    customer_name: d.customer_name || "", customer_address: d.customer_address || "",
    items: (d.items?.length ? d.items : [{}]).map(it => ({description: it.description || "", quantity: it.quantity || "", unit: it.unit || "ชิ้น", unit_price: it.unit_price || ""})),
    discount: d.discount || "", note: d.note || "",
  };
  const missing = new Set(ev.missing || []);
  const card = document.createElement("div");
  card.className = "card";
  container.appendChild(card);

  function draw() {
    const miss = key => missing.has(key) ? " missing" : "";
    card.innerHTML = `
      <div class="card-head">📄 ใบเสนอราคา <span class="tag">${docNo ? "แก้ไข " + esc(docNo) : "ตรวจและแก้ไขได้"}</span></div>
      <div class="card-body">
        ${ev.warnings?.length ? `<div class="warnbox"><b>⚠ ตรวจจุดนี้ก่อน</b><ul>${ev.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
        <div class="row2">
          <div class="field"><label>ชื่อลูกค้า <span class="req">*</span></label><input class="in${miss("customer_name")}" data-k="customer_name" value="${esc(state.customer_name)}" placeholder="เช่น บริษัท เอบีซี จำกัด"></div>
          <div class="field"><label>ที่อยู่ลูกค้า</label><input class="in" data-k="customer_address" value="${esc(state.customer_address)}" placeholder="ไม่บังคับ"></div>
        </div>
        <div class="field"><label>รายการสินค้า / บริการ <span class="req">*</span></label>
          <table class="items">
            <tr><th>รายการ</th><th style="width:80px">จำนวน</th><th style="width:78px">หน่วย</th><th style="width:118px">ราคา/หน่วย</th><th style="width:100px;text-align:right">จำนวนเงิน</th><th style="width:30px"></th></tr>
            ${state.items.map((it, i) => `<tr>
              <td><input class="in${miss(`items.${i}.description`) || miss("items")}" data-i="${i}" data-f="description" value="${esc(it.description)}" placeholder="ชื่อสินค้า"></td>
              <td><input class="in r${miss(`items.${i}.quantity`)}" data-i="${i}" data-f="quantity" value="${esc(it.quantity)}" inputmode="decimal" placeholder="0"></td>
              <td><input class="in" data-i="${i}" data-f="unit" value="${esc(it.unit)}"></td>
              <td><input class="in r${miss(`items.${i}.unit_price`)}" data-i="${i}" data-f="unit_price" value="${esc(it.unit_price)}" inputmode="decimal" placeholder="0.00"></td>
              <td class="amt" data-amt="${i}"></td>
              <td>${state.items.length > 1 ? `<button class="del" data-del="${i}" title="ลบรายการ">×</button>` : ""}</td>
            </tr>`).join("")}
          </table>
          <button class="add" data-add>+ เพิ่มรายการ</button>
        </div>
        <div class="row2">
          <div class="field"><label>ส่วนลด (บาท)</label><input class="in r" data-k="discount" value="${esc(state.discount)}" inputmode="decimal" placeholder="0.00"></div>
          <div class="field"><label>หมายเหตุ</label><input class="in" data-k="note" value="${esc(state.note)}" placeholder="เช่น ยืนราคา 30 วัน"></div>
        </div>
        <div class="sum" data-sum></div>
      </div>
      <div class="card-foot">
        ${docNo ? `<button class="btn" data-cancel>ยกเลิก</button>` : ""}
        <button class="btn primary" data-submit>${docNo ? "บันทึกการแก้ไข" : "สร้างเอกสาร"}</button>
      </div>`;
    bind(); recalc();
  }

  const num = v => parseFloat(String(v).replace(/,/g, "")) || 0;
  function recalc() {
    let sub = 0;
    state.items.forEach((it, i) => { const a = round2(num(it.quantity) * num(it.unit_price)); sub += a; card.querySelector(`[data-amt="${i}"]`).textContent = a ? fmt(a) : "–"; });
    const disc = num(state.discount), after = sub - disc, vat = round2(after * 0.07);
    card.querySelector("[data-sum]").innerHTML =
      `<div><span>รวมเป็นเงิน</span><span>${fmt(sub)}</span></div>` +
      (disc ? `<div><span>ส่วนลด</span><span>−${fmt(disc)}</span></div>` : "") +
      `<div><span>VAT 7%</span><span>${fmt(vat)}</span></div>` +
      `<div class="total"><span>ยอดรวมทั้งสิ้น</span><span>${fmt(after + vat)} บาท</span></div>`;
  }

  function bind() {
    card.querySelectorAll("[data-k]").forEach(el => el.oninput = () => { state[el.dataset.k] = el.value; missing.delete(el.dataset.k); el.classList.remove("missing"); recalc(); });
    card.querySelectorAll("[data-f]").forEach(el => el.oninput = () => {
      state.items[el.dataset.i][el.dataset.f] = el.value;
      missing.delete(`items.${el.dataset.i}.${el.dataset.f}`); missing.delete("items");
      el.classList.remove("missing"); recalc();
    });
    card.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { state.items.splice(+b.dataset.del, 1); missing.clear(); draw(); });
    card.querySelector("[data-add]").onclick = () => { state.items.push({description: "", quantity: "", unit: "ชิ้น", unit_price: ""}); draw(); card.querySelectorAll('[data-f="description"]').item(state.items.length - 1).focus(); };
    card.querySelector("[data-cancel]")?.addEventListener("click", () => card.replaceWith(docCard(ev.result, ev)));
    card.querySelector("[data-submit]").onclick = submit;
  }

  function validate() {
    missing.clear();
    if (!state.customer_name.trim()) missing.add("customer_name");
    state.items.forEach((it, i) => {
      if (!it.description.trim()) missing.add(`items.${i}.description`);
      if (num(it.quantity) <= 0) missing.add(`items.${i}.quantity`);
      if (num(it.unit_price) <= 0) missing.add(`items.${i}.unit_price`);
    });
    return missing.size === 0;
  }

  async function submit() {
    if (!validate()) { draw(); card.querySelector(".missing")?.focus(); return; }
    const btn = card.querySelector("[data-submit]");
    btn.disabled = true; btn.textContent = "กำลังสร้าง...";
    const data = {
      customer_name: state.customer_name.trim(), customer_address: state.customer_address.trim(),
      items: state.items.map(it => ({description: it.description.trim(), quantity: num(it.quantity), unit: it.unit.trim() || "ชิ้น", unit_price: num(it.unit_price)})),
      discount: num(state.discount), note: state.note.trim(),
    };
    try {
      const r = await fetch("/api/quotation", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({data, request: ev.request || "", doc_no: docNo})});
      const res = await r.json();
      if (!r.ok) throw new Error(res.detail);
      const next = {...ev, data, missing: [], warnings: [], result: res};
      card.replaceWith(docCard(res, next));
      history.push({role: "assistant", content: `${docNo ? "แก้ไข" : "สร้าง"}ใบเสนอราคา ${res.doc_no} ให้ ${res.customer} ยอดรวม ${fmt(res.total)} บาท แล้ว`});
      loadDocs();
    } catch (e) {
      btn.disabled = false; btn.textContent = docNo ? "บันทึกการแก้ไข" : "สร้างเอกสาร";
      alert("สร้างเอกสารไม่สำเร็จ: " + e.message);
    }
  }

  draw();
  if (ev.auto && !docNo) submit();
  return card;
}

function docCard(res, ev) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<div class="doc-card">
      <div class="doc-icon">QT</div>
      <div class="doc-info">
        <b>${esc(res.doc_no)}</b>
        <div>${esc(res.customer)} · ${res.items} รายการ</div>
        <div class="money">${fmt(res.total)} บาท</div>
      </div>
      <div class="doc-actions">
        <button class="btn" data-edit>แก้ไข</button>
        <a class="btn primary" href="${res.url}" target="_blank">เปิดเอกสาร</a>
      </div>
    </div>`;
  el.querySelector("[data-edit]").onclick = () => {
    const holder = document.createElement("div");
    el.replaceWith(holder);
    const form = renderQuotationForm(holder, {...ev, result: res}, res.doc_no);
    holder.replaceWith(form);
  };
  return el;
}

// ---------- Sidebar ----------
async function loadTasks() {
  try { tasks = await (await fetch("/api/tasks")).json(); } catch { tasks = []; }
  $("#taskList").innerHTML = tasks.map(t => `<button class="side-item" data-ex="${esc(t.example)}" ${t.ready ? "" : 'data-soon="1"'}>
      <span class="ic">${t.icon}</span>${esc(t.name)}${t.ready ? "" : '<span class="meta"><span class="badge">เร็วๆ นี้</span></span>'}</button>`).join("");
  $("#taskList").querySelectorAll(".side-item").forEach(b => b.onclick = () => {
    closeSide();
    if (b.dataset.soon) { send(b.dataset.ex); return; }
    input.value = b.dataset.ex; autoGrow(); input.focus(); input.select(); sendBtn.disabled = false;
  });
  if (!history.length) showWelcome();
}
async function loadDocs() {
  try {
    const docs = await (await fetch("/api/documents")).json();
    $("#docList").innerHTML = docs.length ? docs.map(d => `<a class="side-item doc" href="/output/${esc(d.doc_no)}.html" target="_blank">
        <b>${esc(d.doc_no)}</b><span>${esc(d.customer)} · ${fmt(d.total)} ฿</span></a>`).join("") : '<div class="empty-note">ยังไม่มีเอกสาร</div>';
  } catch {}
}
async function checkHealth() {
  try {
    const h = await (await fetch("/api/health")).json();
    const ok = h.ollama === "ok" && h.model_ready;
    $("#dot").className = "dot " + (ok ? "ok" : "bad");
    $("#statusText").textContent = ok ? `พร้อมใช้งาน · ${h.model}` : (h.ollama === "ok" ? `ไม่พบโมเดล ${h.model}` : "AI ไม่ทำงาน (เปิด Ollama)");
  } catch { $("#dot").className = "dot bad"; $("#statusText").textContent = "เชื่อมต่อ server ไม่ได้"; }
}

// ---------- Input ----------
function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }
input.addEventListener("input", () => { autoGrow(); sendBtn.disabled = busy || !input.value.trim(); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
sendBtn.onclick = () => send(input.value);
$("#newChat").onclick = () => { if (busy) return; history = []; showWelcome(); closeSide(); input.focus(); };
const closeSide = () => { $("#side").classList.remove("open"); $("#scrim").classList.remove("open"); };
$("#menuBtn").onclick = () => { $("#side").classList.add("open"); $("#scrim").classList.add("open"); };
$("#scrim").onclick = closeSide;

loadTasks(); loadDocs(); checkHealth(); setInterval(checkHealth, 30000);
input.focus();
</script>
</body>
